<!DOCTYPE html>
<html>
<head>
  <title>Football Game</title>
  <style>
    body {
      background: #0a5c2f;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    canvas {
      background: #1e8f4d;
      display: block;
      margin: 20px auto;
      border: 4px solid white;
    }
    button {
      padding: 15px 20px;
      margin: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h2 style="color:white;">⚽ Football Game</h2>

<canvas id="game" width="300" height="500"></canvas>

<div>
  <button onclick="moveUp()">⬆️</button><br>
  <button onclick="moveLeft()">⬅️</button>
  <button onclick="moveRight()">➡️</button><br>
  <button onclick="moveDown()">⬇️</button>
</div>

<script src="game.js"></script>

</body>
</html>
