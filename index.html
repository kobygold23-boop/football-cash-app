<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Football Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>⚽ Football Game</h2>

<div id="pitch">
  <div id="player"></div>
  <div id="ball"></div>
</div>

<div id="controls">
  <button onclick="moveUp()">⬆️</button><br>

  <button onclick="moveRight()">➡️</button>
</div>

<script src="game.js"></script>
</body>
</html>
