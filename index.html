<!DOCTYPE html>
<html>
<head>
  <title>Football Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #0b1b2b;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    canvas {
      background: #0a7a2a;
      display: block;
      margin: 10px auto;
      border: 4px solid white;
    }
    .controls button {
      width: 70px;
      height: 70px;
      font-size: 24px;
      margin: 5px;
    }
  </style>
</head>
<body>

<h2>⚽ Football Game</h2>

<canvas id="gameCanvas" width="360" height="600"></canvas>

<div class="controls">
  <div>
    <button onclick="moveUp()">⬆️</button>
  </div>
  <div>
    <button onclick="moveLeft()">⬅️</button>
    <button onclick="moveDown()">⬇️</button>
    <button onclick="moveRight()">➡️</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
<button id="leftBtn">⬅️</button>
<button id="upBtn">⬆️</button>
<button id="downBtn">⬇️</button>
<button id="rightBtn">➡️</button>
